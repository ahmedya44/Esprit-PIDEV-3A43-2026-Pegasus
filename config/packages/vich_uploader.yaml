vich_uploader:
    db_driver: orm
    mappings:
        products:
            uri_prefix: /images/products
            upload_destination: '%kernel.project_dir%/public/images/products'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
        forum_images:
            uri_prefix: /uploads/forum
            upload_destination: '%kernel.project_dir%/public/uploads/forum'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
